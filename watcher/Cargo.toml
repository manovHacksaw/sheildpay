[package]
name = "zec-watcher"
version = "0.1.0"
edition = "2021"

[dependencies]
zcash_client_backend = { version = "0.25", features = ["lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots", "orchard"] }
zcash_keys = { version = "0.17", features = ["orchard"] }
zcash_protocol = "0.11"
zcash_address = "0.14"
zcash_primitives = "0.31"
orchard = "0.16"
zcash_note_encryption = "0.5"
zip32 = "0.3"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tokio-stream = "0.1"
axum = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
bip39 = { version = "2", features = ["rand"] }
