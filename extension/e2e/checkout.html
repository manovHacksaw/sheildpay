<!doctype html>
<html><head><meta charset="utf-8"><title>Mock checkout</title>
<style>body{font:15px system-ui;max-width:520px;margin:30px auto}.row{display:flex;justify-content:space-between;margin:8px 0}input{padding:8px;margin:4px 0;width:100%;box-sizing:border-box}</style></head>
<body>
<h2>Payment</h2>
<div class="row"><span>Item subtotal</span><span id="sub">$10.00</span></div>
<div class="row"><span>Total Payable</span><span id="tot">$10.00</span></div>
<button id="toggle" type="button">Have a gift card?</button>
<form id="gc" hidden onsubmit="return false">
  <input id="code" placeholder="Enter Gift Card Number" autocomplete="off">
  <input id="pin" placeholder="PIN" autocomplete="off">
  <button id="apply" type="button">Apply</button>
</form>
<p id="msg"></p>
<script>
// Emulates a controlled input: state only updates from real input events, never from .value alone.
const state = { code: "", pin: "" };
const $ = (id) => document.getElementById(id);
$("toggle").onclick = () => { $("gc").hidden = false; $("toggle").hidden = true; };
$("code").addEventListener("input", (e) => (state.code = e.target.value));
$("pin").addEventListener("input", (e) => (state.pin = e.target.value));
$("apply").onclick = () => {
  if (state.code.length < 8) { $("msg").textContent = "Invalid gift card"; return; }
  $("tot").textContent = "$0.00";
  $("msg").textContent = "Gift card applied: " + state.code;
  window.__applied = { ...state };
};
</script></body></html>
